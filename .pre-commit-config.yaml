# Keeps notebooks reproducible: jupytext keeps the .ipynb <-> .py:percent pair in
# sync, and nbstripout removes all cell outputs/execution counts before commit so
# only source (not rendered results) is versioned. Enable with: pre-commit install
repos:
  - repo: https://github.com/mwouts/jupytext
    rev: v1.16.4
    hooks:
      - id: jupytext
        args: [--sync]
        files: ^notebooks/.*\.(ipynb|py)$
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        files: ^notebooks/.*\.ipynb$
